# Avisos de librerías con fallas de seguridad conocidas. Una vez por mes, agrupadas en un solo pedido por ecosistema,
# para no llenar de correos ni de publicaciones. Las ramas dependabot/* no publican en Vercel (vercel.json).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]
