# Heladas de la última noche por satélite GOES-19 (temperatura de la superficie). Todas las mañanas.
# Guarda en la rama datos: no publica la web. Ver scripts/goes_heladas.py.
name: Heladas GOES

on:
  workflow_dispatch: {}
  schedule:
    - cron: "26 11 * * *"

permissions:
  contents: write

concurrency:
  group: goes-heladas
  cancel-in-progress: false

jobs:
  heladas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Calcular
        run: |
          pip install -r requirements.txt netCDF4 numpy
          python scripts/goes_heladas.py data/goes_heladas.json
      - name: Guardar en la rama datos (no publica la web)
        if: always()
        run: |
          cp scripts/datos_rama.sh /tmp/datos_rama.sh && bash /tmp/datos_rama.sh guardar "Heladas GOES $(date -u +%Y-%m-%d)" data/goes_heladas.json
