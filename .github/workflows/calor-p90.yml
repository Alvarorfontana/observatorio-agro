# Umbrales de ola de calor (percentil 90, ERA5) para las 80 localidades. Corre a mano o una vez por año.
name: Umbrales de calor

on:
  workflow_dispatch: {}
  schedule:
    - cron: "11 6 2 1 *"

permissions:
  contents: write

jobs:
  p90:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Traer datos de la rama datos
        run: bash scripts/datos_rama.sh traer
      - name: Calcular
        run: |
          pip install requests
          python scripts/calor_p90.py data/calor_p90.json
      - name: Guardar en la rama datos (no publica la web)
        if: always()
        run: |
          cp scripts/datos_rama.sh /tmp/datos_rama.sh && bash /tmp/datos_rama.sh guardar "Umbrales de ola de calor por localidad $(date -u +%Y-%m-%d\ %H:%M)" data/calor_p90.json
