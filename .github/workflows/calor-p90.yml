# Umbrales de ola de calor (percentil 90, ERA5) para las 80 localidades. Corre a mano o una vez por año.
name: Umbrales de calor

on:
  workflow_dispatch: {}
  schedule:
    - cron: "11 6 2 1 *"

permissions:
  contents: write

jobs:
  p90:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Calcular
        run: |
          pip install requests
          python scripts/calor_p90.py data/calor_p90.json
      - name: Guardar
        if: always()
        run: |
          git config user.name "DOTS calor"
          git config user.email "actions@users.noreply.github.com"
          git add data/calor_p90.json || true
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -q -m "Umbrales de ola de calor por localidad"
            git pull -q --rebase && git push -q
          fi
