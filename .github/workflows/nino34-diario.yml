# Copia diaria de la temperatura del mar en la región Niño 3.4 (NOAA OISST 2.1 vía Climate Reanalyzer).
# La página /nino-diario la lee en vivo; esta copia en la rama datos se usa si la fuente no responde.
name: El Niño día por día

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 13 * * *"

permissions:
  contents: write

concurrency:
  group: nino34-diario
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Bajar y verificar
        run: |
          mkdir -p data
          URL=https://climatereanalyzer.org/clim/sst_daily/json_2clim/oisst2.1_nino3.4_sst_day.json
          code=$(curl -sSL --retry 3 --max-time 120 -A "Mozilla/5.0 (DOTS observatorio; +https://github.com/Alvarorfontana/observatorio-agro)" \
            -H "Accept: application/json" -H "Referer: https://climatereanalyzer.org/clim/sst_daily/" \
            -o /tmp/nino34.json -w '%{http_code}' "$URL" || true)
          if [ "$code" != "200" ]; then echo "::error::Climate Reanalyzer respondió HTTP $code"; head -c 300 /tmp/nino34.json 2>/dev/null; exit 1; fi
          python3 scripts/nino34_verificar.py /tmp/nino34.json data/nino34_diario.json
      - name: Guardar en la rama datos (no publica la web)
        run: |
          cp scripts/datos_rama.sh /tmp/datos_rama.sh && bash /tmp/datos_rama.sh guardar "El Niño día por día $(date -u +%Y-%m-%d)" data/nino34_diario.json
