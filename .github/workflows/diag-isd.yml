name: Diagnóstico ISD (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          { curl -sS "https://aviationweather.gov/api/data/metar?bbox=-31.5,-53,-28.5,-49.5&format=json&hours=2" | head -c 900; echo; echo ----;
            curl -sS "https://aviationweather.gov/api/data/metar?bbox=-34.5,-72,-32.5,-69.5&format=json&hours=2" | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d),[ (x.get('icaoId'),x.get('name'),x.get('temp'),x.get('wspd'),x.get('obsTime')) for x in d[:5]])"; } > out.txt 2>&1
          python3 -c "print('::notice title=AWC::'+open('out.txt').read().replace('%','%25').replace('\n','%0A'))"
