name: Chequeo en vivo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"   # todos los días 07:17 de Argentina

permissions:
  contents: read

jobs:
  vivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/chequeo_vivo.py https://observatorio-agro.vercel.app
