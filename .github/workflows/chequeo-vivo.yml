name: Chequeo en vivo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"   # todos los días 07:17 de Argentina
  deployment_status:

permissions:
  contents: read

jobs:
  vivo:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/chequeo_vivo.py https://observatorio-agro.vercel.app
