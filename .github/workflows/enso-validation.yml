name: ENSO scientific integration checks
on:
  push:
    branches: [integracion-clima-enso-v4]
  pull_request:
    paths:
      - "enso_data_api.py"
      - "enso_science.py"
      - "iri_enso_api.py"
      - "integrations/clima-enso-analyzer/**"
      - "tests/test_enso_regions.py"
      - ".github/workflows/enso-validation.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: python -m pip install flask requests pytest
      - name: Validate API Python syntax
        run: python -m py_compile enso_data_api.py enso_science.py iri_enso_api.py api/index.py
      - name: Validate NOAA parser contracts
        run: python -m pytest -q tests/test_enso_regions.py
      - name: Run imported scientific engine tests if present
        shell: bash
        run: |
          if [ -f integrations/clima-enso-analyzer/pyproject.toml ]; then
            python -m pip install -e integrations/clima-enso-analyzer
            python -m pytest -q integrations/clima-enso-analyzer/tests
          else
            echo "Motor Clima ENSO v4 aun no importado: pruebas del motor pendientes"
          fi
