name: DOTS Radar CI
on:
  push:
    branches: [mejora-auditoria-fuentes-20261019]
  pull_request:
    paths:
      - 'flood_*.py'
      - 'radar.py'
      - 'research_routes.py'
      - 'src/site/FloodRadarPanel*'
      - 'tests/test_flood*.py'
      - '.github/workflows/dots-radar-ci.yml'
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q flood_sar_change.py flood_radar_adapter.py flood_methods.py research_routes.py
      - run: python -m pytest tests/test_flood_sar_change.py tests/test_flood_radar_adapter.py tests/test_flood_methods.py tests/test_audit_hydro_radar.py -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
