name: diag whisp
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,time,urllib.request
          B='https://observatorio-agro.vercel.app/api/fuentes/eudr/whisp'
          LOT=[[-28.56,-58.71],[-28.56,-58.69],[-28.54,-58.69],[-28.54,-58.71]]
          def post(b):
              r=urllib.request.Request(B,data=json.dumps(b).encode(),headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(r,timeout=70) as x: return x.status,json.loads(x.read())
              except urllib.error.HTTPError as e: return e.code,json.loads(e.read() or b'{}')
          out=[]; st,js=post({'lot':{'name':'Lote control','vertices':LOT},'product':'bovino'})
          for i in range(6):
              d=js.get('data') or {}
              out.append(f"{st} status={js.get('status')} err={str(js.get('error'))[:150]} data={str(d)[:300]}")
              tok=d.get('token')
              if js.get('status')!='pendiente' and not (tok and d.get('status') in ('analysis_queued','analysis_processing','pendiente')): break
              time.sleep(10); st,js=post({'token':tok,'product':'bovino'})
          print('::notice::'+' || '.join(out))
          PY
