name: DOTS integración (sin despliegue)
on:
  push:
    branches:
      - feature/dots-integracion-total-20261021
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
  population-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_population_routes_smoke.py tests/test_agro_telemetry_api.py tests/test_enso_teleconnections_api.py tests/test_noaa_teleconnections.py tests/test_nasa_power_point.py tests/test_ina_levels.py

  enso-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas xarray netCDF4 pytest
      - run: python -m pytest -q tests/test_enso_atmosphere.py tests/test_enso_ersst.py
