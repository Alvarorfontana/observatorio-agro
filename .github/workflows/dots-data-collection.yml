name: DOTS data collection

on:
  workflow_dispatch:
  schedule:
    - cron: "25 9 * * *"

permissions:
  contents: write

concurrency:
  group: dots-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install requests
      - name: Collect FAOSTAT and NASA POWER data
        run: python -m agentic.collectors.run_cycle
      - name: Commit new source snapshots
        run: |
          git config user.name "DOTS Data Agent"
          git config user.email "dots-data-agent@users.noreply.github.com"
          git add data/dots/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "DOTS: update agricultural and climate observations"
            git push origin HEAD:\${GITHUB_REF_NAME}
          fi
