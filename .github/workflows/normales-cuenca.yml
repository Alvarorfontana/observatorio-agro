# Normales de la Cuenca del Plata (caudal 2001-2020 y lluvia de cabeceras) para el panel regional.
# Corre a mano o una vez por año; guarda data/cuenca_normales.json en el repositorio.
name: Normales de la Cuenca del Plata

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 9 15 1 *"   # 15 de enero

permissions:
  contents: write

jobs:
  normales:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Calcular normales
        run: |
          pip install requests numpy
          python scripts/normales_cuenca.py data/cuenca_normales.json
      - name: Guardar
        run: |
          git config user.name "DOTS normales"
          git config user.email "actions@users.noreply.github.com"
          git add data/cuenca_normales.json
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -q -m "Normales de la Cuenca del Plata $(date -u +%Y-%m-%d)"
            git push -q
          fi
