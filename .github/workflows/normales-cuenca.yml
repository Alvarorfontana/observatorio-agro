# Cifras de referencia de la Cuenca del Plata: caudal normal y crecidas de retorno (GloFAS), récords de
# altura (INA), tiempos de traslado y relación lluvia → crecida (NASA POWER). Gratis y por partes:
# corre todos los días hasta completar las 34 localidades; después no hace nada hasta el año siguiente.
name: Normales de la Cuenca del Plata

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: normales-cuenca
  cancel-in-progress: false

jobs:
  normales:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Calcular
        run: |
          pip install requests numpy
          python scripts/normales_cuenca.py data/cuenca_normales.json
      - name: Guardar
        run: |
          git config user.name "DOTS normales"
          git config user.email "actions@users.noreply.github.com"
          git add data/cuenca_normales.json scripts/cache || true
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -q -m "Cifras de referencia de la Cuenca del Plata $(date -u +%Y-%m-%d)"
            git pull -q --rebase && git push -q
          fi
