# Cifras de referencia de la Cuenca del Plata: caudal normal y crecidas de retorno (GloFAS), récords de
# altura (INA), tiempos de traslado y relación lluvia → crecida (NASA POWER). Gratis y por partes:
# corre todos los días hasta completar las 34 localidades; después no hace nada hasta el año siguiente.
name: Normales de la Cuenca del Plata

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: normales-cuenca
  cancel-in-progress: false

jobs:
  normales:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Traer datos de la rama datos
        run: bash scripts/datos_rama.sh traer
      - name: Calcular
        run: |
          pip install requests numpy
          python scripts/normales_cuenca.py data/cuenca_normales.json
      - name: Guardar en la rama datos (no publica la web)
        if: always()
        run: |
          cp scripts/datos_rama.sh /tmp/datos_rama.sh && bash /tmp/datos_rama.sh guardar "Cifras de referencia de la Cuenca del Plata $(date -u +%Y-%m-%d\ %H:%M)" data/cuenca_normales.json scripts/cache
