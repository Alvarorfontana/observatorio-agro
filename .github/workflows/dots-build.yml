name: DOTS frontend build validation
on:
  push:
    branches:
      - feat/dots-vision-suelos-territorio
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dots-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dots-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
