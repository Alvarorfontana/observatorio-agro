# Referencia de El Niño para ~80 localidades de Sudamérica (ERA5 desde 1991 + ONI de NOAA).
# Corre una vez por mes; la web sólo lee el resultado (data/enso_sudamerica.json).
name: El Niño en Sudamérica

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 7 8 * *"

permissions:
  contents: write

concurrency:
  group: enso-sudamerica
  cancel-in-progress: false

jobs:
  referencia:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Traer datos de la rama datos
        run: bash scripts/datos_rama.sh traer
      - name: Calcular
        run: |
          pip install -r requirements.txt
          python scripts/enso_sudamerica.py data/enso_sudamerica.json
      - name: Guardar en la rama datos (no publica la web)
        if: always()
        run: |
          cp scripts/datos_rama.sh /tmp/datos_rama.sh && bash /tmp/datos_rama.sh guardar "El Niño en Sudamérica: referencia $(date -u +%Y-%m-%d\ %H:%M)" data/enso_sudamerica.json
