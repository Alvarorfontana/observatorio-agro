# Referencia de El Niño para ~80 localidades de Sudamérica (ERA5 desde 1991 + ONI de NOAA).
# Corre una vez por mes; la web sólo lee el resultado (data/enso_sudamerica.json).
name: El Niño en Sudamérica

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 7 8 * *"

permissions:
  contents: write

concurrency:
  group: enso-sudamerica
  cancel-in-progress: false

jobs:
  referencia:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Calcular
        run: |
          pip install -r requirements.txt
          python scripts/enso_sudamerica.py data/enso_sudamerica.json
      - name: Guardar
        if: always()
        run: |
          git config user.name "DOTS El Niño"
          git config user.email "actions@users.noreply.github.com"
          git add data/enso_sudamerica.json || true
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -q -m "El Niño en Sudamérica: referencia $(date -u +%Y-%m-%d)"
            git pull -q --rebase && git push -q
          fi
