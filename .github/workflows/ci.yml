name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pip-audit
      - run: pytest -q
      - name: Auditoría de dependencias Python
        run: pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

  web:
    name: Sitio (tipos y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Auditoría de dependencias npm
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  validacion:
    name: Validación científica (xclim y climate_indices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt xclim climate-indices
      - run: python scripts/validar_indices.py
