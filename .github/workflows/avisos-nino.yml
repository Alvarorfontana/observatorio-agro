# Avisos automáticos de El Niño: una vez por día lee la temperatura del mar en la región Niño 3.4 y, si cambia de
# categoría, marca un récord o sube rápido, avisa por Telegram (con los tres gráficos), ntfy y correo.
# Para pedir un parte con gráficos a mano: Actions → "Avisos de El Niño" → Run workflow → forzar: si.
# Ver scripts/avisos_nino.py.
name: Avisos de El Niño

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Mandar ahora un parte con gráficos aunque no haya cambios (si/no)"
        required: false
        default: "no"
  schedule:
    - cron: "41 13 * * *"

permissions:
  contents: read

concurrency:
  group: avisos-nino
  cancel-in-progress: false

jobs:
  avisos-nino:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # La memoria del aviso (último dato y categoría) se guarda en la caché de Actions, no en el repositorio.
      - name: Recuperar el último estado
        uses: actions/cache/restore@v6
        with:
          path: data/nino_avisos_estado.json
          key: nino-estado-${{ github.run_id }}
          restore-keys: nino-estado-
      - name: Revisar El Niño, generar gráficos y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          AVISOS_FROM: ${{ secrets.AVISOS_FROM }}
          NINO_FORZAR: ${{ github.event.inputs.forzar }}
        run: |
          pip install requests matplotlib
          python scripts/avisos_nino.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar el estado
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/nino_avisos_estado.json
          key: nino-estado-${{ github.run_id }}
      - name: Guardar los gráficos del día
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graficos-el-nino
          path: data/nino_graficos/
          if-no-files-found: ignore
          retention-days: 30
