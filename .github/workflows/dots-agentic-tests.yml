name: DOTS Agentic validation

on:
  push:
    branches: [main, "feature/dots-historical-atlas-agents"]
    paths:
      - "agentic/**"
      - "api/index.py"
      - "tests/test_dots_*.py"
      - ".github/workflows/dots-agentic-tests.yml"
  pull_request:
    paths:
      - "agentic/**"
      - "api/index.py"
      - "tests/test_dots_*.py"
      - ".github/workflows/dots-agentic-tests.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DOTS test dependencies
        run: python -m pip install flask requests pytest
      - name: Test DOTS agents and data collectors
        run: python -m pytest -q tests/test_dots_agentic_routes.py tests/test_dots_collectors.py
