name: DOTS Agentic validation

on:
  push:
    branches: [main, "feature/dots-historical-atlas-agents"]
    paths:
      - "agentic/**"
      - "api/index.py"
      - "tests/**"
      - ".github/workflows/dots-agentic-tests.yml"
  pull_request:
    paths:
      - "agentic/**"
      - "api/index.py"
      - "tests/**"
      - ".github/workflows/dots-agentic-tests.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Test agent registry and atlas API
        run: python -m pytest -q tests/
