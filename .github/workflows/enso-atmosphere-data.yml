# El Niño: OLR y presión Tahití–Darwin observados (NOAA PSL), una vez por mes y a pedido.
# Guarda en la rama datos (no publica la web); la web los lee en /api/enso/atmosfera.
name: ENSO atmósfera NOAA

on:
  workflow_dispatch: {}
  schedule:
    - cron: "27 10 12 * *"

permissions:
  contents: write

concurrency:
  group: enso-atmosfera
  cancel-in-progress: false

jobs:
  atmosphere:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install numpy xarray pandas netCDF4 pytest
      - run: python -m pytest -q tests/test_enso_atmosphere.py
      - name: Descargar productos NOAA PSL
        run: |
          mkdir -p /tmp/dots-atmo data
          curl --fail --location --retry 3 --max-time 600 'https://downloads.psl.noaa.gov/Datasets/interp_OLR/olr.mon.mean.nc' -o /tmp/dots-atmo/olr.nc
          curl --fail --location --retry 3 --max-time 600 'https://downloads.psl.noaa.gov/Datasets/ncep.reanalysis.derived/surface/slp.mon.mean.nc' -o /tmp/dots-atmo/slp.nc
          test $(stat -c%s /tmp/dots-atmo/olr.nc) -gt 100000
          test $(stat -c%s /tmp/dots-atmo/slp.nc) -gt 100000
      - name: Derivar anomalías
        run: python tools/build_enso_atmosphere.py --olr /tmp/dots-atmo/olr.nc --slp /tmp/dots-atmo/slp.nc --output data/enso-atmosphere.json
      - name: Validar producto sin datos inventados
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/enso-atmosphere.json'))
          assert d['status'].get('olr')=='ok',d['status']
          assert d['status'].get('slp')=='ok',d['status']
          for k in ('olr_pacific','tahiti_minus_darwin_slp_anomaly'):
              s=d['products'][k]
              assert len(s['months'])>=400 and len(s['months'])==len(s['values'])
              assert sum(v is not None for v in s['values'])>=400
          print('Productos atmosféricos NOAA verificados',list(d['products']))
          PY
      - name: Guardar en la rama datos (no publica la web)
        run: |
          cp scripts/datos_rama.sh /tmp/datos_rama.sh && bash /tmp/datos_rama.sh guardar "ENSO atmósfera $(date -u +%Y-%m-%d)" data/enso-atmosphere.json
