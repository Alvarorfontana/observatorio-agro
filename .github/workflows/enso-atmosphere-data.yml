name: ENSO atmosfera NOAA - datos reales (sin despliegue)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/dots-integracion-total-20261021
    paths:
      - '.github/workflows/enso-atmosphere-data.yml'
      - 'tools/build_enso_atmosphere.py'
permissions:
  contents: write
jobs:
  atmosphere:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install numpy xarray pandas netCDF4 pytest
      - run: python -m pytest -q tests/test_enso_atmosphere.py
      - name: Descargar productos NOAA PSL
        run: |
          mkdir -p /tmp/dots-atmo public/data
          curl --fail --location --retry 3 --max-time 600 'https://downloads.psl.noaa.gov/Datasets/interp_OLR/olr.mon.mean.nc' -o /tmp/dots-atmo/olr.nc
          curl --fail --location --retry 3 --max-time 600 'https://downloads.psl.noaa.gov/Datasets/ncep.reanalysis.derived/surface/slp.mon.mean.nc' -o /tmp/dots-atmo/slp.nc
          test $(stat -c%s /tmp/dots-atmo/olr.nc) -gt 100000
          test $(stat -c%s /tmp/dots-atmo/slp.nc) -gt 100000
      - name: Derivar anomalías reales
        run: python tools/build_enso_atmosphere.py --olr /tmp/dots-atmo/olr.nc --slp /tmp/dots-atmo/slp.nc --output public/data/enso-atmosphere.json
      - name: Validar producto sin datos inventados
        run: |
          python - <<'PY'
          import json
          d=json.load(open('public/data/enso-atmosphere.json'))
          assert d['status'].get('olr')=='ok',d['status']
          assert d['status'].get('slp')=='ok',d['status']
          for k in ('olr_pacific','tahiti_minus_darwin_slp_anomaly'):
              s=d['products'][k]
              assert len(s['months'])>=400
              assert len(s['months'])==len(s['values'])
              assert sum(v is not None for v in s['values'])>=400
          print('Productos atmosféricos NOAA verificados',list(d['products']))
          PY
      - name: Incorporar resultados en rama integración
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/enso-atmosphere.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(enso): incorporar OLR y presión NOAA observadas'
            git push origin HEAD:feature/dots-integracion-total-20261021
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dots-enso-atmosfera-noaa
          path: public/data/enso-atmosphere.json
          retention-days: 30
          if-no-files-found: error
