    <script>
        // --- CONFIGURACIÓN DEL MAPA PREMIUM ---
        var map = L.map('map', { 
            zoomControl: false,
            attributionControl: true
        }).setView([-34.6037, -58.3816], 5);

        // Agregar controles de zoom en posición estética
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // Capa base de respaldo (siempre visible debajo de las capas NASA)
        var osmLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        var capaActual = null;
        
        // URLs CORREGIDAS para WMTS de NASA GIBS
        var capasGIBS = {
            'modis': "https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/wmts.cgi?layer=MODIS_Terra_CorrectedReflectance_TrueColor&style=default&tilematrixset=250m&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileColumn={x}&TileRow={y}&TileMatrix={z}&",
            'viirs': "https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/wmts.cgi?layer=VIIRS_SNPP_CorrectedReflectance_TrueColor&style=default&tilematrixset=500m&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileColumn={x}&TileRow={y}&TileMatrix={z}&",
            'sst': "https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/wmts.cgi?layer=MODIS_Terra_L3_SST_Mid-IR_4um_Night_Daily&style=default&tilematrixset=1km&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileColumn={x}&TileRow={y}&TileMatrix={z}&",
            'thermal': "https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/wmts.cgi?layer=VIIRS_SNPP_Thermal_Hotspots_and_Fire_Activity_NRT&style=default&tilematrixset=375m&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileColumn={x}&TileRow={y}&TileMatrix={z}&"
        };

        function cambiarCapa(tipo, btn) {
            // Remover capa anterior si existe
            if (capaActual) {
                map.removeLayer(capaActual);
                capaActual = null;
            }
            
            // Crear nueva capa con opciones específicas para WMTS
            capaActual = L.tileLayer(capasGIBS[tipo], {
                maxZoom: 9, 
                minZoom: 2, 
                attribution: 'NASA GIBS | Datos Satelitales en Tiempo Real', 
                tms: true, // CRÍTICO: Las capas WMTS de NASA requieren TMS invertido
                opacity: 0.95
            }).addTo(map);

            // Actualizar estado visual de botones
            document.querySelectorAll('.control-group .btn-premium').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        // Cargar MODIS por defecto al iniciar
        cambiarCapa('modis', document.querySelector('.control-group .btn-premium'));

        // --- LÓGICA DE DIBUJO Y ANÁLISIS ---
        var isDrawing = false, puntosLote = [], marcadores = [], poligonoLayer = null;

        function startDrawing() {
            isDrawing = true; puntosLote = [];
            marcadores.forEach(m => map.removeLayer(m)); marcadores = [];
            if (poligonoLayer) map.removeLayer(poligonoLayer);
            
            document.getElementById('btn-draw').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'flex';
            document.getElementById('btn-analyze').style.display = 'none';
            document.getElementById('lote-info').style.display = 'none';
            
            // Cambiar cursor para indicar modo dibujo
            map.getContainer().style.cursor = 'crosshair';
            map.on('click', onMapClick);
        }

        function stopDrawing() {
            isDrawing = false; map.off('click', onMapClick);
            map.getContainer().style.cursor = '';
            document.getElementById('btn-draw').style.display = 'flex';
            document.getElementById('btn-stop').style.display = 'none';
        }

        function onMapClick(e) {
            if (!isDrawing) return;
            puntosLote.push([e.latlng.lat, e.latlng.lng]);
            
            var marker = L.circleMarker(e.latlng, {
                radius: 6, color: '#3b82f6', fillColor: '#3b82f6', 
                fillOpacity: 1, weight: 2
            }).addTo(map);
            marcadores.push(marker);
            
            document.getElementById('num-vertices').innerText = puntosLote.length;
            if (puntosLote.length >= 3) {
                document.getElementById('btn-analyze').style.display = 'flex';
            }
        }

        function analyzeLote() {
            if (puntosLote.length < 3) return;
            isDrawing = false; map.off('click', onMapClick);
            map.getContainer().style.cursor = '';
            
            poligonoLayer = L.polygon(puntosLote, {
                color: '#10b981', weight: 3, fillOpacity: 0.15, 
                dashArray: '5, 5'
            }).addTo(map);
            map.fitBounds(poligonoLayer.getBounds(), { padding: [50, 50] });
            
            var latSum = 0, lonSum = 0;
            puntosLote.forEach(p => { latSum += p[0]; lonSum += p[1]; });
            var cLat = (latSum / puntosLote.length).toFixed(4);
            var cLon = (lonSum / puntosLote.length).toFixed(4);
            
            document.getElementById('centroide').innerText = `${cLat}, ${cLon}`;
            document.getElementById('lote-info').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';
            document.getElementById('btn-analyze').innerHTML = '⏳ Procesando Ensemble...';
            document.getElementById('btn-analyze').disabled = true;

            fetch('/api/analizar', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nombre: "Lote_Premium", lat: parseFloat(cLat), lon: parseFloat(cLon), poligono: puntosLote })
            })
            .then(r => {
                if (!r.ok) throw new Error('Error en servidor');
                return r.blob();
            })
            .then(blob => {
                var url = window.URL.createObjectURL(blob);
                var a = document.createElement('a'); a.href = url; a.download = "informe_premium.pdf";
                document.body.appendChild(a); a.click(); a.remove();
                document.getElementById('btn-analyze').innerHTML = '✅ Informe Descargado';
                
                setTimeout(() => { 
                    document.getElementById('btn-analyze').innerHTML = ' Generar Informe PDF'; 
                    document.getElementById('btn-analyze').disabled = false;
                    document.getElementById('btn-draw').style.display = 'flex'; 
                }, 3000);
            })
            .catch(err => { 
                document.getElementById('btn-analyze').innerHTML = '❌ Error al generar'; 
                console.error(err); 
            });
        }

        // --- CARGA DE VARIABLES EN TIEMPO REAL ---
        async function cargarVariables() {
            try {
                const res = await fetch('/api/variables?lat=-34.6037&lon=-58.3816');
                const d = await res.json();
                if(d.error) throw new Error(d.error);

                // Renderizar Métricas Principales
                const metricsHTML = `
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-label">TEMPERATURA 2M</div>
                            <div class="metric-value">${d.temp_actual}<span class="metric-unit">°C</span></div>
                            <div class="metric-trend trend-up">Sensación: ${d.sensacion_termica}°C</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">HUMEDAD RELATIVA</div>
                            <div class="metric-value">${d.humedad}<span class="metric-unit">%</span></div>
                            <div class="metric-trend">Déficit VP: ${d.deficit_presion_vapor} kPa</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">VIENTO 10M / RÁFAGAS</div>
                            <div class="metric-value">${d.viento_10m}<span class="metric-unit">km/h</span></div>
                            <div class="metric-trend trend-down">Ráfagas: ${d.rafagas} km/h</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">PRESIÓN SUPERFICIE</div>
                            <div class="metric-value">${d.presion_superficie}<span class="metric-unit">hPa</span></div>
                            <div class="metric-trend">Nubes: ${d.cobertura_nubes}%</div>
                        </div>
                    </div>
                `;
                document.getElementById('metrics-container').innerHTML = metricsHTML;

                // Renderizar Suelo
                const soilHTML = `
                    <div class="metrics-grid">
                        <div class="metric-card" style="border-left: 3px solid #06b6d4;">
                            <div class="metric-label">HUMEDAD SUELO (0-7cm)</div>
                            <div class="metric-value">${d.humedad_suelo_0_7}<span class="metric-unit">m³/m³</span></div>
                        </div>
                        <div class="metric-card" style="border-left: 3px solid #06b6d4;">
                            <div class="metric-label">EVAPOTRANSPIRACIÓN (ET0)</div>
                            <div class="metric-value">${d.evapotranspiracion}<span class="metric-unit">mm</span></div>
                        </div>
                    </div>
                `;
                document.getElementById('soil-container').innerHTML = soilHTML;

                // Renderizar Alertas
                let alertsHTML = '';
                let thiClass = d.thi < 79 ? 'alert-ok' : (d.thi < 89 ? 'alert-warn' : 'alert-crit');
                alertsHTML += `<div class="alert-banner ${thiClass}"> THI GANADERO: ${d.thi} (${d.estado_thi})</div>`;
                
                let ensoIcon = d.enso_estado.includes('Niño') ? '🔴' : (d.enso_estado.includes('Niña') ? '' : '⚪');
                alertsHTML += `<div class="alert-banner alert-ok">${ensoIcon} ENSO: ${d.enso_estado} (ONI: ${d.enso_oni})</div>`;
                
                if(d.cantidad_focos > 0) {
                    alertsHTML += `<div class="alert-banner alert-crit">🔥 ALERTA: ${d.cantidad_focos} foco(s) térmico(s) activo(s)</div>`;
                } else {
                    alertsHTML += `<div class="alert-banner alert-ok">✅ Sin focos térmicos activos en radio 50km</div>`;
                }
                document.getElementById('alerts-container').innerHTML = alertsHTML;

            } catch (e) {
                document.getElementById('metrics-container').innerHTML = `<div class="alert-banner alert-crit">️ Error de conexión API: ${e.message}</div>`;
            }
        }
        
        // Ejecutar carga inicial
        cargarVariables();
    </script>
